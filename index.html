<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Cake Order</title>
<style>
  :root {
    --soft-blue: #a8c5e2;
    --soft-blue-light: #dceaf6;
    --warm-brown: #7a5230;
    --warm-brown-dark: #5c3d22;
    --soft-yellow: #f7e3a1;
    --soft-yellow-light: #fdf6dd;
    --cream: #fdf8ef;
    --ink: #4a3524;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(160deg, var(--soft-blue-light), var(--soft-yellow-light));
    text-align: center;
    padding: 28px 16px 24px;
    border-bottom: 3px dotted var(--soft-blue);
  }
  header h1 {
    font-family: 'Segoe Script', 'Comic Sans MS', cursive;
    color: var(--warm-brown-dark);
    font-size: 2rem;
  }
  header p { color: var(--warm-brown); font-style: italic; margin-top: 4px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  section {
    background: #fff;
    border: 2px solid var(--soft-blue);
    border-radius: 22px;
    padding: 20px 18px;
    margin-top: 20px;
    box-shadow: 0 4px 14px rgba(122, 82, 48, 0.10);
  }
  section h2 {
    font-family: 'Segoe Script', 'Comic Sans MS', cursive;
    color: var(--warm-brown);
    font-size: 1.3rem;
    margin-bottom: 12px;
  }
  label { display: block; font-weight: bold; color: var(--warm-brown-dark); margin: 14px 0 6px; }
  select, input[type="text"], input[type="date"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--soft-blue);
    border-radius: 14px;
    background: var(--soft-blue-light);
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
  }
  textarea { min-height: 70px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--soft-blue);
    background: var(--soft-yellow-light);
    color: var(--warm-brown-dark);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip.selected {
    background: var(--soft-yellow);
    border-color: var(--warm-brown);
    font-weight: bold;
  }
  .method-row { display: flex; gap: 10px; margin-bottom: 6px; }
  .method-btn {
    flex: 1;
    border: 2px solid var(--soft-blue);
    background: var(--soft-blue-light);
    border-radius: 16px;
    padding: 14px 8px;
    font-family: inherit;
    font-size: 1rem;
    color: var(--warm-brown-dark);
    cursor: pointer;
  }
  .method-btn.selected {
    background: var(--soft-yellow);
    border-color: var(--warm-brown);
    font-weight: bold;
  }
  #deliveryFeeNote { font-size: 0.85rem; font-style: italic; color: var(--warm-brown); margin-top: 4px; }
  .summary-card {
    background: var(--soft-yellow-light);
    border: 2px dashed var(--warm-brown);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .summary-card p { margin: 5px 0; }
  .summary-card strong { color: var(--warm-brown-dark); }
  .send-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    background: var(--warm-brown);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 15px;
    font-family: 'Segoe Script', 'Comic Sans MS', cursive;
    font-size: 1.15rem;
    cursor: pointer;
  }
  .send-btn:active { background: var(--warm-brown-dark); }
  footer { text-align: center; font-style: italic; color: var(--warm-brown); font-size: 0.85rem; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>🍓 Cozy Cake Order</h1>
  <p>Handmade cakes from a cozy Malaysian home kitchen</p>
</header>
<main>

  <!-- Section 1: Custom Cake -->
  <section id="section-cake">
    <h2>1. Build Your Cake</h2>

    <label for="cakeType">Cake type</label>
    <select id="cakeType">
      <option>Round Butter Cake</option>
      <option selected>Chocolate Moist Cake</option>
      <option>Pandan Chiffon Cake</option>
      <option>Carrot Walnut Cake</option>
    </select>

    <label for="cakeFlavour">Flavour</label>
    <select id="cakeFlavour">
      <option selected>Belgian Chocolate</option>
      <option>Vanilla Gula Melaka</option>
      <option>Pandan Kaya</option>
      <option>Salted Caramel</option>
    </select>

    <label>Toppings (pick as many as you like)</label>
    <div class="chips" id="toppingChips">
      <button class="chip selected" data-topping="Fresh strawberries">Fresh strawberries 🍓</button>
      <button class="chip" data-topping="Oreo crumbs">Oreo crumbs 🍪</button>
      <button class="chip selected" data-topping="Cream cheese frosting">Cream cheese frosting 🧁</button>
      <button class="chip" data-topping="Toasted almonds">Toasted almonds 🌰</button>
      <button class="chip" data-topping="Mini marshmallows">Mini marshmallows ☁️</button>
    </div>

    <label for="specialNotes">Special notes</label>
    <textarea id="specialNotes" placeholder="e.g. less sweet, write 'Selamat Hari Raya' on top...">Less sweet please, and write "Happy Birthday Iman" on top.</textarea>
  </section>

  <!-- Section 2: Pickup or Delivery -->
  <section id="section-method">
    <h2>2. Pickup or Delivery</h2>

    <div class="method-row">
      <button class="method-btn" id="btnPickup">🏠 Pickup</button>
      <button class="method-btn selected" id="btnDelivery">🛵 Delivery</button>
    </div>
    <p id="deliveryFeeNote">Delivery available around Shah Alam &amp; Klang Valley (fee confirmed via WhatsApp).</p>

    <label id="dateLabel" for="orderDate">Preferred delivery date</label>
    <input type="date" id="orderDate">
  </section>

  <!-- Section 3: Order Summary -->
  <section id="section-summary">
    <h2>3. Your Order</h2>
    <div class="summary-card" id="summaryCard"></div>
    <button class="send-btn" id="sendBtn">📲 Send order on WhatsApp</button>
  </section>

</main>
<footer>No payment here — details are confirmed with the baker on WhatsApp. 🧸</footer>

<script>
  // --- Elements ---
  const cakeType = document.getElementById('cakeType');
  const cakeFlavour = document.getElementById('cakeFlavour');
  const chips = Array.from(document.querySelectorAll('#toppingChips .chip'));
  const specialNotes = document.getElementById('specialNotes');
  const btnPickup = document.getElementById('btnPickup');
  const btnDelivery = document.getElementById('btnDelivery');
  const deliveryFeeNote = document.getElementById('deliveryFeeNote');
  const dateLabel = document.getElementById('dateLabel');
  const orderDate = document.getElementById('orderDate');
  const summaryCard = document.getElementById('summaryCard');
  const sendBtn = document.getElementById('sendBtn');

  let deliveryMethod = 'Delivery';

  // Sensible default date: 3 days from today
  const defaultDate = new Date();
  defaultDate.setDate(defaultDate.getDate() + 3);
  orderDate.value = defaultDate.toISOString().slice(0, 10);
  orderDate.min = new Date().toISOString().slice(0, 10);

  function selectedToppings() {
    return chips.filter(c => c.classList.contains('selected')).map(c => c.dataset.topping);
  }

  function prettyDate(v) {
    if (!v) return 'Not chosen yet';
    const d = new Date(v + 'T00:00:00');
    return d.toLocaleDateString('en-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function renderSummary() {
    const tops = selectedToppings();
    summaryCard.innerHTML =
      '<p><strong>Cake:</strong> ' + cakeType.value + '</p>' +
      '<p><strong>Flavour:</strong> ' + cakeFlavour.value + '</p>' +
      '<p><strong>Toppings:</strong> ' + (tops.length ? tops.join(', ') : 'None') + '</p>' +
      '<p><strong>Notes:</strong> ' + (specialNotes.value.trim() || 'None') + '</p>' +
      '<p><strong>' + deliveryMethod + ':</strong> ' + prettyDate(orderDate.value) + '</p>';
  }

  // --- Feature 1: live summary updates ---
  [cakeType, cakeFlavour, specialNotes, orderDate].forEach(el => {
    el.addEventListener('input', renderSummary);
    el.addEventListener('change', renderSummary);
  });
  chips.forEach(chip => chip.addEventListener('click', () => {
    chip.classList.toggle('selected');
    renderSummary();
  }));

  // --- Feature 2: pickup / delivery switch keeps a ready date field ---
  function setMethod(m) {
    deliveryMethod = m;
    const isDelivery = m === 'Delivery';
    btnDelivery.classList.toggle('selected', isDelivery);
    btnPickup.classList.toggle('selected', !isDelivery);
    dateLabel.textContent = isDelivery ? 'Preferred delivery date' : 'Preferred pickup date';
    deliveryFeeNote.textContent = isDelivery
      ? 'Delivery available around Shah Alam & Klang Valley (fee confirmed via WhatsApp).'
      : 'Pickup from our home kitchen in Shah Alam, Seksyen 7 — exact address shared on WhatsApp.';
    renderSummary();
  }
  btnPickup.addEventListener('click', () => setMethod('Pickup'));
  btnDelivery.addEventListener('click', () => setMethod('Delivery'));

  // --- Feature 3: send to WhatsApp ---
  sendBtn.addEventListener('click', () => {
    const tops = selectedToppings();
    const msg =
      'Hello! I would like to order a cake. 🍰\n\n' +
      'Cake: ' + cakeType.value + '\n' +
      'Flavour: ' + cakeFlavour.value + '\n' +
      'Toppings: ' + (tops.length ? tops.join(', ') : 'None') + '\n' +
      'Notes: ' + (specialNotes.value.trim() || 'None') + '\n' +
      'Method: ' + deliveryMethod + '\n' +
      'Date: ' + prettyDate(orderDate.value) + '\n\n' +
      'Please confirm availability. Thank you!';
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  });

  // Initial render so the app never opens empty
  renderSummary();
</script>
</body>
</html>
